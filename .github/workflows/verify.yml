name: Verify development candidate
on:
  pull_request:
  push:
    branches: [development/integrated-workshops]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run baseline:check
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: |
          printf 'DEV_AUTH=true\nABUSE_SALT=ci-test-only-not-a-production-secret\n' > .dev.vars
          npm run db:local
          npx wrangler d1 execute adventure-station-local --local --file scripts/seed-local.sql
          npx wrangler d1 execute adventure-station-local --local --file scripts/seed-e2e.sql
          npm run build
          npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-evidence
          path: test-results/
      # No deployment token, production resource, customer data or payment secret is used by CI.
